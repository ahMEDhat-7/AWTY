name: awty

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: awty
      POSTGRES_PASSWORD: awty
      POSTGRES_DB: awty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awty -d awty"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://awty:awty@postgres:5432/awty
    env_file:
      - path: .env
        required: true
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/worker-entry.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://awty:awty@postgres:5432/awty
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
