name: awty

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: awty
      POSTGRES_PASSWORD: awty
      POSTGRES_DB: awty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awty -d awty"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "5432:5432"

  # One-shot init job: applies Prisma migrations, then exits 0. api and
  # worker wait for it (service_completed_successfully), which is what makes
  # `docker compose up` sufficient even on an empty volume (TASK-092/093).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: awty
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://awty:awty@postgres:5432/awty
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: awty
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://awty:awty@postgres:5432/awty
    env_file:
      - path: .env
        required: true
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: awty
    command: ["node", "dist/worker-entry.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://awty:awty@postgres:5432/awty
    env_file:
      - path: .env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
